name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check custom_components/magiqtouch tests

  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v5"
        - uses: "home-assistant/actions/hassfest@master"
